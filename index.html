<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Root Note - Piano Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Init / Start Page — "Root Note" cover-page-concept (definitief
     doorgevoerd na evaluatie via Frontpage_Desktop.html/Frontpage_Mobiel.html,
     zie Root_Note_Context.md). De hele merk-/titelkaart is de start-knop
     (onclick="App.init()" direct erop, geen los knopje meer). -->
<div id="init-overlay">
  <div class="theme-toggle-container">
    <button onclick="Lang.toggle()" id="lang-btn-start" class="start-theme-btn" title="Switch language">NL</button>
    <button onclick="ThemeManager.toggle()" id="theme-btn-start" class="start-theme-btn"><span class="theme-icon">☀️</span></button>
  </div>
  <div class="welcome-bg-decor">
    <div class="blob one"></div>
    <div class="blob two"></div>
  </div>
  <div class="welcome-content">
    <button type="button" class="brand-launch-btn" onclick="App.init()" title="Start Applicatie">
      <div class="brand-mark-lg glitter">
        <svg viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="12" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="23" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="34" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="7" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
          <rect x="18" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
          <rect x="29" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
        </svg>
      </div>
      <div class="title-group">
        <h1 class="main-title">Root Note</h1>
        <p class="sub-title-premium" data-i18n="homeSubtitle">De Piano Trainer</p>
      </div>
    </button>
    <div class="start-meta">
      <p class="creator-credit">Designed by Martijn van Willigen · © 2026</p>
      <p class="version-tag">v0.18.2 | Bèta Editie</p>
    </div>
  </div>

  <!-- Eigen pianogeluid (WAV-samples) laden is een optionele, geavanceerde
       functie voor een klein aantal gebruikers — bereikbaar via het
       map-icoon in het menu (zijbalk/onderbalk), niet meer expliciet
       uitgelegd op deze pagina. Zie README_Eigen_Pianogeluid.md voor uitleg
       die je aan iemand anders kunt meesturen. Deze input moet WEL blijven
       bestaan (verborgen): het menu-icoon triggert 'm via zijn id. -->
  <input type="file" id="global-sample-upload" multiple webkitdirectory directory accept="audio/wav,audio/mpeg,audio/x-wav,.wav" style="display:none;" onchange="App.handleFileUpload(event)">
</div>

<!-- Tegel-overzicht (sinds v0.17.5) — tussenscherm tussen de coverpagina en
     een module: elke (App, Modus)-combinatie is hier een eigen tegel, met een
     MIDI-label erop, zodat MIDI-vereisende en MIDI-vrije oefeningen niet
     langer door elkaar staan in dezelfde navigatie. Volledig door
     TilesUI.render() (js/tiles-ui.js) opgebouwd uit TILE_REGISTRY
     (js/app-core.js) — geen tegels met de hand in deze HTML, zie
     Root_Note_Context.md voor de architectuur-toelichting. Zelfde
     theme-toggle-container-patroon als #init-overlay hierboven, rechtsboven. -->
<div id="tiles-page" style="display:none;">
  <!-- Ambient gloed-blobs, zelfde als #init-overlay hierboven (gebruikersverzoek
       bij de dashboard-herstijling: "referentiestijl is de gecentreerde
       glow-esthetiek van het startscherm") — zie CSS voor de verbrede selectors. -->
  <div class="welcome-bg-decor">
    <div class="blob one"></div>
    <div class="blob two"></div>
  </div>
  <div class="theme-toggle-container">
    <button onclick="Lang.toggle()" id="lang-btn-tiles" class="start-theme-btn" title="Switch language">NL</button>
    <button onclick="ThemeManager.toggle()" id="theme-btn-tiles" class="start-theme-btn"><span class="theme-icon">☀️</span></button>
  </div>
  <h1 class="tiles-heading" data-i18n="tiles_heading">Kies je oefening</h1>
  <div id="tiles-grid"></div>
</div>

<!-- App-schil -->
<div id="app-shell" style="display:none;">
  <!-- Instellingen-paneel (drawer): vervangt de oude header-instellingenrij
       (breed scherm) + het inklapbare paneel (smal scherm) door één en
       hetzelfde mechanisme op elke schermbreedte, geopend via #settings-btn
       in de topbar. #quick-controls verhuist hier eenmalig naartoe (zie
       App.moveQuickControlsToDrawer, aangeroepen vanuit loadModule). -->
  <div id="settings-drawer-backdrop" onclick="SettingsUI.toggleDrawer(false)"></div>
  <aside id="settings-drawer">
    <div class="settings-drawer-head">
      <span data-i18n="settings_title">Instellingen</span>
      <button type="button" id="settings-drawer-close" onclick="SettingsUI.toggleDrawer(false)" data-i18n-aria="settings_close" aria-label="Sluiten">✕</button>
    </div>
    <!-- #quick-controls (per-module instellingen) verhuist hier eenmalig
         naartoe, vóór #settings-reset-row (zie App.moveQuickControlsToDrawer,
         die insertBefore gebruikt i.p.v. appendChild zodat de reset-rij
         altijd ONDERAAN blijft staan). Reset-knop sinds v0.17.5 per-app
         i.p.v. globaal (zie Root_Note_Context.md) — reset alle instellingen
         van de HUIDIGE app (alle modi ervan samen), niet alleen deze tegel. -->
    <div class="settings-drawer-body" id="settings-drawer-body">
      <div class="settings-reset-row" id="settings-reset-row">
        <button type="button" id="reset-module-btn" onclick="App.resetCurrentModuleSettings()">↺ <span data-i18n="reset_module_label">Reset deze app</span></button>
      </div>
    </div>
  </aside>

  <div id="content-area">
    <!-- Sinds v0.17.5: geen zijbalk/onderbalk meer tijdens het oefenen (zie
         Root_Note_Context.md) — de terug-knop leidt naar #tiles-page, en de
         geluid/thema/fullscreen/taal-iconen die voorheen in de zijbalk-
         footer/onderbalk stonden wonen nu hier, naast het instellingen-
         tandwiel. Behouden dezelfde ids (sound-btn-header/theme-btn-header/
         fullscreen-btn-header/lang-btn-header) zodat SoundUI/ThemeManager/
         Lang/syncFullscreenIcon() ze zonder JS-wijziging blijven vinden. -->
    <header id="content-topbar">
      <!-- Terug-knop + modus-schakelaar SAMEN in .topbar-left (gebruikers-
           feedback: stonden los van elkaar los-geplaatst met een grote,
           onnette tussenruimte door de flex-space-between-verdeling over
           4 losse elementen). .topbar-left/.topbar-right zijn nu de 2
           buitenste kolommen van een 1fr/auto/1fr-grid, met #module-title
           gegarandeerd gecentreerd in de middelste kolom — was verschoven
           doordat de schakelaar eerst als los 4e flex-item meetelde in de
           ruimteverdeling. Zie Root_Note_Context.md. -->
      <div class="topbar-left">
        <button type="button" id="back-to-tiles-btn" class="topbar-icon-btn" onclick="App.showTiles()" data-i18n-title="tooltip_back" title="Terug">⬅</button>
        <!-- Modus-schakelaar (sinds de tegel-consolidatie naar 1 tegel per
             app) — alleen zichtbaar voor apps met meerdere Modi
             (Flashcards/Continu/Challenge/enz.), volledig door
             App.renderModeSwitcher() opgebouwd. -->
        <div id="mode-switcher-bar" style="display:none;"></div>
      </div>
      <h1 id="module-title" data-i18n="settings_title">Instellingen</h1>
      <div class="topbar-right">
        <button class="topbar-icon-btn" onclick="SoundUI.toggle()" id="sound-btn-header" title="Geluid uitzetten">🔊</button>
        <button class="topbar-icon-btn" onclick="ThemeManager.toggle()" id="theme-btn-header" data-i18n-title="tooltip_theme" title="Wissel thema">☀️</button>
        <button class="topbar-icon-btn" onclick="App.toggleFullscreen()" id="fullscreen-btn-header" data-i18n-title="tooltip_fullscreen" title="Volledig scherm">⛶</button>
        <button class="topbar-icon-btn" onclick="Lang.toggle()" id="lang-btn-header" title="Switch language / Wissel taal">NL</button>
        <button type="button" id="settings-btn" onclick="SettingsUI.toggleDrawer()" data-i18n-title="settings_title" title="Instellingen">⚙</button>
      </div>
    </header>

    <main id="module-view">
      <section id="workspace">
      <div id="quick-controls"></div>
      <div class="flashcard" id="flashcard-ui">
        <div id="score-paper"></div>
        <div id="svg-container">
          <div class="circle-main">
            <div class="circle-left-half">
              <div id="circle-quick-jump"></div>
              <div class="circle-center">
                <div id="circle-wheel-wrap"></div>
              </div>
              <div id="circle-chord-jump"></div>
            </div>
            <div class="circle-right-half">
              <div id="circle-chord-preview"></div>
              <div id="circle-keyboard-wrap"></div>
            </div>
          </div>
          <!-- Lopende-band-modus (Fase 1.2, Noten Lezen) — zelfde "los van
               de gewone kaart-flow" opzet als .circle-main hierboven; welke
               van de twee zichtbaar is wordt door App/renderData() bepaald. -->
          <div id="scroll-view">
            <div id="scroll-counter"></div>
            <div id="scroll-strip-host"></div>
            <div id="scroll-status"></div>
          </div>
        </div>
        <div id="interval-extra-controls" style="display:none;"></div>
        <div id="text-quiz" class="text-quiz-display">Vraag komt hier</div>
        <div id="answer-display">Antwoord</div>
        <div id="answer-score" style="display:none; width:100%;"></div>
        <!-- MIDI-akkoordcontrole (Fase 2.2): alleen zichtbaar zolang App.wireMidiChordCheck
             'm toont (module=Akkoorden + MidiEngine.connected) — zie app-core.js. -->
        <div id="midi-answer-status" style="display:none;"></div>
        <!-- MIDI-toonladder-speel-na (Fase 2.3): idem, module=Toonladders. Eén
             "pil" per noot in de reeks, zie App._buildMidiScaleProgress(). -->
        <div id="midi-scale-progress" style="display:none;"></div>

        <div class="flashcard-actions" id="flashcard-actions">
          <div class="action-row-top">
            <button onclick="App.playCurrent()">🎵 <span data-i18n="btn_play">Speel Af</span></button>
            <button onclick="App.toggleAnswer()">👁 <span data-i18n="btn_showAnswer">Toon Antwoord</span></button>
          </div>
          <div class="action-row-bottom">
            <button id="btn-prev" onclick="App.prevQuestion()">⬅ <span data-i18n="btn_prev">Vorige</span></button>
            <button id="btn-next" class="primary" onclick="App.nextQuestion()"><span data-i18n="btn_next">Volgende</span> ➔</button>
          </div>
        </div>
      </div>
      <p class="swipe-hint" id="swipe-hint" data-i18n="swipeHint">Swipe ⬅➔ op de kaart om te wisselen</p>

      <!-- Muziektheorie-naslagwerk (Fase 3.2, sinds v0.15.0) — GEEN
           flashcard/quiz-structuur zoals de rest, zie TheoryUI.render()
           (js/theory-ui.js). Zelfde "los top-level scherm, getoond/verborgen
           via loadModule()"-opzet als #piano-module hierboven. -->
      <div id="theory-view">
        <div id="theory-content"></div>
      </div>

      <div id="piano-module">
        <div class="piano-ui-controls">
          <button class="piano-btn" onclick="PianoUI.scroll(-200)">⬅ <span data-i18n="piano_left">Links</span></button>
          <button class="piano-btn primary" onclick="PianoUI.centerC4()"><span data-i18n="piano_center">Midden (C4)</span></button>
          <button class="piano-btn" onclick="PianoUI.scroll(200)"><span data-i18n="piano_right">Rechts</span> ➔</button>
        </div>
        <div class="piano-wrapper" id="piano-wrapper">
          <div class="piano-keyboard" id="piano-keys"></div>
        </div>
      </div>
    </section>
  </main>
  </div>
</div>

<!-- Eigen pianogeluid laden: bewust NIET in de zichtbare zijbalk/onderbalk-
     iconenrij (riep bij de meeste gebruikers alleen maar vragen op voor
     een functie die verder bijna niemand gebruikt) — een heel klein,
     laag-contrast knopje linksonder in beeld, altijd bereikbaar, maar valt
     niet op tenzij je er specifiek naar zoekt. Zie ook
     README_Eigen_Pianogeluid.md. -->
<button type="button" id="samples-hidden-trigger" onclick="App.pickSamplesFolder()" data-i18n-title="tooltip_samples" title="Eigen pianogeluid laden">📁</button>

<!-- MIDI-statusindicator (Fase 1.1): puur een klein bolletje, geen knop —
     er is (nog) geen apparaat-kiezer om naartoe te klikken, zie
     Root_Note_Context.md. Zelfde bewust-onopvallende stijl als
     #samples-hidden-trigger hierboven, ernaast geplaatst. -->
<div id="midi-status-indicator" title="Geen MIDI-apparaat gevonden"></div>


<script src="js/lang.js"></script>
<script src="js/theme.js"></script>
<script src="js/music-theory.js"></script>
<script src="js/audio-engine.js"></script>
<script src="js/midi-engine.js"></script>
<script src="js/scroll-engine.js"></script>
<script src="js/challenge-engine.js"></script>
<script src="js/score-renderer.js"></script>
<script src="js/theory-data.js"></script>
<script src="js/theory-ui.js"></script>
<script src="js/piano-ui.js"></script>
<script src="js/circle-wheel.js"></script>
<script src="js/file-access.js"></script>
<script src="js/app-core.js"></script>
<script src="js/settings-ui.js"></script>
<script src="js/tiles-ui.js"></script>
<script src="js/sound-ui.js"></script>
<script>
(function initSwipe(){
  const card = document.getElementById('flashcard-ui');
  let startX = 0, startY = 0;
  card.addEventListener('touchstart', (e) => {
    startX = e.changedTouches[0].screenX; startY = e.changedTouches[0].screenY;
  }, {passive:true});
  card.addEventListener('touchend', (e) => {
    const current = App.history[App.historyIndex];
    if (App.currentModule === 'circle' && current && current.c_mode === 'visual') return;
    const dx = e.changedTouches[0].screenX - startX;
    const dy = e.changedTouches[0].screenY - startY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if (dx < 0) App.nextQuestion(); else App.prevQuestion();
    }
  }, {passive:true});
})();

ThemeManager.init();
SoundUI.init();
Lang.init();
// MIDI zo vroeg mogelijk starten (sinds v0.16.1, gebruikersfeedback) —
// niet pas wanneer App.init() draait (dat gebeurt pas ná een klik op de
// cover page). Zo begint de toestemmings-prompt/eerste-verbinding-race
// (zie MidiEngine.init()'s vertraagde herscans) al te lopen terwijl de
// gebruiker nog naar de cover page kijkt, ruim vóórdat iemand daadwerkelijk
// een MIDI-module opent.
MidiEngine.init();
(function wireResponsiveSettings(){
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (App.currentModule === 'circle' && typeof CircleWheel !== 'undefined') CircleWheel.render();
    }, 120);
  });
})();
(function syncFullscreenIcon(){
  const update = () => {
    const btn = document.getElementById('fullscreen-btn-header');
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.documentElement.classList.toggle('fullscreen-active', isFs);
    if (btn){ btn.innerHTML = isFs ? '⤡' : '⛶'; btn.title = isFs ? 'Volledig scherm afsluiten' : 'Volledig scherm'; }
  };
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
})();
</script>
</body>
</html>
