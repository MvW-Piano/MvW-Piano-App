<title>Root Note - Piano Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<body>

<!-- Init / Start Page — "Root Note" cover-page-concept (definitief
     doorgevoerd na evaluatie via Frontpage_Desktop.html/Frontpage_Mobiel.html,
     zie Root_Note_Context.md). De hele merk-/titelkaart is de start-knop
     (onclick="App.init()" direct erop, geen los knopje meer). -->
<div id="init-overlay">
  <div class="theme-toggle-container">
    <button onclick="Lang.toggle()" id="lang-btn-start" class="start-theme-btn" title="Switch language">NL</button>
    <button onclick="ThemeManager.toggle()" id="theme-btn-start" class="start-theme-btn"><span class="theme-icon">☀️</span></button>
  </div>
  <div class="welcome-bg-decor">
    <div class="blob one"></div>
    <div class="blob two"></div>
  </div>
  <div class="welcome-content">
    <button type="button" class="brand-launch-btn" onclick="App.init()" title="Start Applicatie">
      <div class="brand-mark-lg glitter">
        <svg viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="12" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="23" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="34" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="7" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
          <rect x="18" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
          <rect x="29" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
        </svg>
      </div>
      <div class="title-group">
        <h1 class="main-title">Root Note</h1>
        <p class="sub-title-premium" data-i18n="homeSubtitle">De Piano Trainer</p>
      </div>
    </button>
    <div class="start-meta">
      <p class="creator-credit">Designed by Martijn van Willigen · © 2026</p>
      <p class="version-tag">v0.17.1 | Bèta Editie</p>
    </div>
  </div>

  <!-- Eigen pianogeluid (WAV-samples) laden is een optionele, geavanceerde
       functie voor een klein aantal gebruikers — bereikbaar via het
       map-icoon in het menu (zijbalk/onderbalk), niet meer expliciet
       uitgelegd op deze pagina. Zie README_Eigen_Pianogeluid.md voor uitleg
       die je aan iemand anders kunt meesturen. Deze input moet WEL blijven
       bestaan (verborgen): het menu-icoon triggert 'm via zijn id. -->
  <input type="file" id="global-sample-upload" multiple webkitdirectory directory accept="audio/wav,audio/mpeg,audio/x-wav,.wav" style="display:none;" onchange="App.handleFileUpload(event)">
</div>

<!-- App-schil -->
<div id="app-shell">

          <rect x="12" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="23" y="1" width="10" height="30" rx="2" fill="#fff"/>
          <rect x="34" y="1" width="10" height="30" rx="2" fill="#fff"/>

          <rect x="18" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>
          <rect x="29" y="1" width="7" height="18" rx="1.5" fill="#0f172a"/>

      <button class="nav-item" id="nav-scales" onclick="App.loadModule('scales')" data-i18n-title="nav_scales" title="Toonladders"><span class="nav-icon">🎵</span><span class="nav-label" data-i18n="nav_scales">Toonladders</span></button>
      <button class="nav-item" id="nav-chords" onclick="App.loadModule('chords')" data-i18n-title="nav_chords" title="Akkoorden"><span class="nav-icon">🎹</span><span class="nav-label" data-i18n="nav_chords">Akkoorden</span></button>
      <button class="nav-item" id="nav-circle" onclick="App.loadModule('circle')" data-i18n-title="nav_circle" title="Kwintencirkel"><span class="nav-icon">🎼</span><span class="nav-label" data-i18n="nav_circle">Kwintencirkel</span></button>
      <button class="nav-item" id="nav-intervals" onclick="App.loadModule('intervals')" data-i18n-title="nav_intervals" title="Intervallen"><span class="nav-icon">👂</span><span class="nav-label" data-i18n="nav_intervals">Intervallen</span></button>
      <button class="nav-item" id="nav-progressions" onclick="App.loadModule('progressions')" data-i18n-title="nav_progressions" title="Akkoordprogressies"><span class="nav-icon">📈</span><span class="nav-label" data-i18n="navLabel_progressions">Progressies</span></button>

      <button class="nav-item" id="nav-piano" onclick="App.loadModule('piano')" data-i18n-title="nav_piano" title="Virtuele Piano"><span class="nav-icon">🎹</span><span class="nav-label" data-i18n="navLabel_piano">Vrij Spelen</span></button>

       (breed scherm) + het inklapbare paneel (smal scherm) door één en
       hetzelfde mechanisme op elke schermbreedte, geopend via #settings-btn
       in de topbar. #quick-controls verhuist hier eenmalig naartoe (zie
       App.moveQuickControlsToDrawer, aangeroepen vanuit loadModule). -->
  <div id="settings-drawer-backdrop" onclick="SettingsUI.toggleDrawer(false)"></div>
  <aside id="settings-drawer">
    <div class="settings-drawer-head">
      <span data-i18n="settings_title">Instellingen</span>
      <button type="button" id="settings-drawer-close" onclick="SettingsUI.toggleDrawer(false)" data-i18n-aria="settings_close" aria-label="Sluiten">✕</button>
    </div>
    <div class="settings-drawer-body" id="settings-drawer-body"></div>
  </aside>

  <nav id="bottom-nav">
    <button class="bnav-item" id="bnav-notes" onclick="App.loadModule('notes')"><span class="bnav-icon">🎯</span><span data-i18n="bnav_notes">Noten</span></button>
    <button class="bnav-item" id="bnav-scales" onclick="App.loadModule('scales')"><span class="bnav-icon">🎵</span><span data-i18n="bnav_scales">Ladders</span></button>
    <button class="bnav-item" id="bnav-chords" onclick="App.loadModule('chords')"><span class="bnav-icon">🎹</span><span data-i18n="bnav_chords">Akk.</span></button>
    <button class="bnav-item" id="bnav-circle" onclick="App.loadModule('circle')"><span class="bnav-icon">🎼</span><span data-i18n="bnav_circle">Cirkel</span></button>
    <button class="bnav-item" id="bnav-intervals" onclick="App.loadModule('intervals')"><span class="bnav-icon">👂</span><span data-i18n="bnav_intervals">Interv.</span></button>
    <button class="bnav-item" id="bnav-progressions" onclick="App.loadModule('progressions')"><span class="bnav-icon">📈</span><span data-i18n="bnav_progressions">Progr.</span></button>
    <button class="bnav-item" id="bnav-sightreading" onclick="App.loadModule('sightreading')"><span class="bnav-icon">👀</span><span data-i18n="bnav_sightreading">Vooruit</span></button>
    <button class="bnav-item" id="bnav-theory" onclick="App.loadModule('theory')"><span class="bnav-icon">📖</span><span data-i18n="bnav_theory">Theorie</span></button>
    <button class="bnav-item" id="bnav-piano" onclick="App.loadModule('piano')"><span class="bnav-icon">🎹</span><span data-i18n="bnav_piano">Piano</span></button>

  <div id="content-area">

      <h1 id="module-title" data-i18n="settings_title">Instellingen</h1>

    </header>

    <main id="module-view">

      <div id="quick-controls"></div>
      <div class="flashcard" id="flashcard-ui">
        <div id="score-paper"></div>
        <div id="svg-container">
          <div class="circle-main">
            <div class="circle-left-half">
              <div id="circle-quick-jump"></div>
              <div class="circle-center">
                <div id="circle-wheel-wrap"></div>
              </div>
              <div id="circle-chord-jump"></div>
            </div>
            <div class="circle-right-half">
              <div id="circle-chord-preview"></div>
              <div id="circle-keyboard-wrap"></div>

               de gewone kaart-flow" opzet als .circle-main hierboven; welke
               van de twee zichtbaar is wordt door App/renderData() bepaald. -->

          <button class="piano-btn primary" onclick="PianoUI.centerC4()"><span data-i18n="piano_center">Midden (C4)</span></button>
          <button class="piano-btn" onclick="PianoUI.scroll(200)"><span data-i18n="piano_right">Rechts</span> ➔</button>
        </div>

<!-- Eigen pianogeluid laden: bewust NIET in de zichtbare zijbalk/onderbalk-
     iconenrij (riep bij de meeste gebruikers alleen maar vragen op voor
     een functie die verder bijna niemand gebruikt) — een heel klein,
     laag-contrast knopje linksonder in beeld, altijd bereikbaar, maar valt
     niet op tenzij je er specifiek naar zoekt. Zie ook
     README_Eigen_Pianogeluid.md. -->
<button type="button" id="samples-hidden-trigger" onclick="App.pickSamplesFolder()" data-i18n-title="tooltip_samples" title="Eigen pianogeluid laden">📁</button>

<!-- MIDI-statusindicator (Fase 1.1): puur een klein bolletje, geen knop —

<div id="midi-status-indicator" title="Geen MIDI-apparaat gevonden"></div>

<script>
(function initSwipe(){
  const card = document.getElementById('flashcard-ui');
  let startX = 0, startY = 0;
  card.addEventListener('touchstart', (e) => {
    startX = e.changedTouches[0].screenX; startY = e.changedTouches[0].screenY;
  }, {passive:true});
  card.addEventListener('touchend', (e) => {
    const current = App.history[App.historyIndex];
    if (App.currentModule === 'circle' && current && current.c_mode === 'visual') return;
    const dx = e.changedTouches[0].screenX - startX;
    const dy = e.changedTouches[0].screenY - startY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if (dx < 0) App.nextQuestion(); else App.prevQuestion();
    }
  }, {passive:true});
})();

ThemeManager.init();
SoundUI.init();
Lang.init();
// MIDI zo vroeg mogelijk starten (sinds v0.16.1, gebruikersfeedback) —
// niet pas wanneer App.init() draait (dat gebeurt pas ná een klik op de
// cover page). Zo begint de toestemmings-prompt/eerste-verbinding-race
// (zie MidiEngine.init()'s vertraagde herscans) al te lopen terwijl de
// gebruiker nog naar de cover page kijkt, ruim vóórdat iemand daadwerkelijk
// een MIDI-module opent.
MidiEngine.init();
(function wireResponsiveSettings(){
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (App.currentModule === 'circle' && typeof CircleWheel !== 'undefined') CircleWheel.render();
    }, 120);
  });
})();
(function syncFullscreenIcon(){
  const update = () => {
    const btn = document.getElementById('fullscreen-btn-header');
    const btnBnav = document.getElementById('fullscreen-btn-bnav');
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    document.documentElement.classList.toggle('fullscreen-active', isFs);
    if (btn){ btn.innerHTML = isFs ? '⤡' : '⛶'; btn.title = isFs ? 'Volledig scherm afsluiten' : 'Volledig scherm'; }
    if (btnBnav){ const icon = btnBnav.querySelector('.bnav-icon'); if (icon) icon.textContent = isFs ? '⤡' : '⛶'; }
  };
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
})();
</script>
